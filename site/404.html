<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı · Karakış Eğitim & Danışmanlık</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1B33'/%3E%3Cpath d='M16 28V14M16 20l-6-5M16 17l6-5M16 23l-5-3' stroke='%23C9A55C' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='9' r='2.4' fill='%23C9A55C'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B1628;color:#F3ECDD;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:24px;max-width:760px;margin:0 auto;padding:48px clamp(16px,5vw,40px)}
p.code{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.16em;color:#C9A55C}
h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.025em}
h1 em{font-style:italic;color:#C9A55C}
p{margin:0;font-size:17px;line-height:1.7;color:#B8B2A6}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:#C9A55C;color:#0B1628;font-weight:600;text-decoration:none}
a.btn:hover{background:#D8B871}
a.btn:focus-visible{outline:2px solid #C9A55C;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">404 · SAYFA BULUNAMADI</p>
  <h1>Bu yol bir yere <em>çıkmıyor.</em></h1>
  <p>Aradığın sayfa taşınmış ya da hiç olmamış olabilir. Ana sayfaya dönüp oradan devam edebilirsin.</p>
  <a class="btn" href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
