<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Veli özeti · Karakış Takip</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#14160c;--mute:#5c6355;--line:#e4e6dc;--bg:#f6f7f1;--card:#fff;--acc:#4f6b00;--soft:#eef3c4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#111;color:#d9f24a;font:800 22px system-ui}
.top b{display:block;font-size:15px;letter-spacing:.04em}.top small{color:var(--mute)}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st{background:var(--bg);border-radius:14px;padding:12px}.st small{display:block;color:var(--mute);font-size:12px}.st b{font-size:22px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}.bars i.z{background:var(--line)}
.ax{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}td.n{text-align:right;font-weight:700}
.note{color:var(--mute);font-size:13px}.btn{display:inline-block;background:#111;color:#fff;border:0;border-radius:12px;padding:11px 18px;font:600 15px system-ui;cursor:pointer}
.err{text-align:center;padding:40px 16px}.err b{display:block;font-size:20px;margin-bottom:8px}
a{color:var(--acc)}
@media print{body{background:#fff}.btn,.noprint{display:none}.card{break-inside:avoid;border-color:#ccc}main{padding:0}}
</style>
</head>
<body>
<main id="app"><p class="note">Yükleniyor…</p></main>
<script src="js/vendor/supabase.js?v=2.117.1"></script>
<script src="js/veli.js?v=1"></script>
</body>
</html>
