<html lang="tr">
<head>
<meta charset="utf-8">

<title>Günlük Takip · Karakış Eğitim</title>
<meta name="theme-color" id="tc" content="#0B1020">

<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{--idle:#6b738c;--gold:var(--acc);--navy:var(--press);--fb:"Space Grotesk",system-ui,sans-serif;--fd:"Space Grotesk",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--cream:#0B1020;--card:#121A33;--line:#27325C;--ink:#EAF0FF;--mute:#9AA7CC;--acc:#3EE6B0;--acc-ink:#06231B;--navy2:#8B7CFF;--goldsoft:#1C3A3A;--hero-bg:linear-gradient(145deg,#18224A,#0F1730);--hero-ink:#EAF0FF;--hero-sub:#9AA7CC;--hbtn:#3EE6B0;--hbtn-ink:#06231B;--press:#1C2547;--press-ink:#3EE6B0;--ok:#3EE6B0;--warn:#FFB84D;--glow:0 0 26px rgba(62,230,176,.45)}
:root[data-theme="light"]{--cream:#FFF4E2;--card:#fff;--line:#F0E4CF;--ink:#1B2A4A;--mute:#5C6785;--acc:#C93A20;--acc-ink:#fff;--navy2:#1B2A4A;--goldsoft:#FFE3D8;--hero-bg:#C93A20;--hero-ink:#fff;--hero-sub:#FFE3D8;--hbtn:#fff;--hbtn-ink:#A92D16;--press:#1B2A4A;--press-ink:#fff;--ok:#2F7D57;--warn:#B35F00;--glow:0 10px 24px rgba(201,58,32,.35);--fb:Nunito,system-ui,sans-serif;--fd:Nunito,system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--fb),system-ui,sans-serif}
h1,h2,.big{font-family:var(--fd);margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
header h1{font-size:20px}header small{color:var(--mute);display:block;font:400 13px var(--fb)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);font:600 14px var(--fb);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--acc-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:26px;padding:22px 20px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.18)}
.hero .st{display:flex;align-items:center;gap:8px;color:var(--hero-sub);font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;background:var(--idle);flex:none}
.dot.study{background:#4fc08d;box-shadow:0 0 0 5px rgba(79,192,141,.25)}.dot.break{background:#f0a73a}.dot.done{background:var(--gold)}
.big{font-weight:700;font-size:64px;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.sub{color:var(--hero-sub);font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.acts .full{grid-column:1/-1}
.btn{border:0;border-radius:16px;padding:15px 12px;font:700 16px var(--fb);cursor:pointer;background:var(--acc);color:var(--acc-ink);transition:transform .15s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px)}
.hero .btn{background:var(--hbtn);color:var(--hbtn-ink);min-height:62px;font-size:19px;box-shadow:var(--glow)}
.hero .btn.full{animation:glow 2.8s ease-in-out infinite}
.hero .btn.alt{background:transparent;color:var(--hero-ink);border:1.5px solid var(--hero-sub);box-shadow:none}
.btn:active{transform:scale(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 14px;min-height:40px;font:600 14px var(--fb);cursor:pointer;transition:transform .15s ease,border-color .2s ease}
.chip:hover{border-color:var(--acc)}.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--press);color:var(--press-ink);border-color:var(--acc)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}
.row label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,select{font:600 16px var(--fb);padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);width:96px}
select{width:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat b{font:700 22px var(--fd);display:block}.stat span{font-size:13px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.tl time{color:var(--mute);font-variant-numeric:tabular-nums;min-width:46px}
.empty{color:var(--mute);font-size:15px}
.mood{display:flex;gap:8px}.mood .chip{padding:7px 12px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;display:block}.s:hover{border-color:var(--gold)}.s .h{font:700 16px var(--fb);display:flex;align-items:center;gap:8px}.s .sp{font-size:13px;color:var(--mute)}.back{border:0;background:none;color:var(--ink);font:700 15px var(--fb);cursor:pointer;padding:6px 0;margin-bottom:8px}.subj{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.s.live{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldsoft)}
.s .n{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
body.offl::before{content:"⚠️ Kaydedilemedi — bağlantını kontrol et. Verilerin cihazında duruyor, bağlantı gelince otomatik gönderilecek.";position:fixed;left:0;right:0;top:0;z-index:60;padding:8px 14px;background:#C93A20;color:#fff;font-size:13px;text-align:center}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
.gl{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}textarea{width:100%;font:16px var(--fb),sans-serif;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);min-height:70px;resize:vertical}.nt{padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}.nt time{display:block;color:var(--mute);font-size:12px}
.rb{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 0;font:inherit;font-size:15px;color:inherit;cursor:pointer;text-align:left}.rb span:last-child{color:var(--mute);text-align:right}
@media (max-width:480px){.big{font-size:52px}.sum{grid-template-columns:repeat(2,1fr)}}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#1b3156 0%,#101a31 42%,#070d19 100%);color:#f8f5ed;animation:sOut .85s cubic-bezier(.7,0,.2,1) 3.15s forwards;pointer-events:none;isolation:isolate}
#splash:before{content:"";position:absolute;width:min(76vw,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(201,165,92,.19),rgba(201,165,92,.04) 42%,transparent 70%);filter:blur(8px);animation:corePulse 2.8s ease-in-out both}
#splash:after{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,transparent 0deg 11deg,rgba(226,201,142,.055) 11.2deg 11.6deg,transparent 12deg 24deg);mask-image:radial-gradient(ellipse at center,#000 0%,transparent 68%);animation:raySpin 18s linear infinite}
#splash .splash-mark{position:relative;z-index:1;width:clamp(112px,25vw,154px);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(226,201,142,.22));animation:markIn 1.2s cubic-bezier(.16,1,.3,1) .1s both}
#splash .ring{stroke-dasharray:314;stroke-dashoffset:314;animation:draw 1.5s cubic-bezier(.2,.8,.2,1) .25s forwards}
#splash .orbit{transform-origin:60px 60px;animation:orbit 5s linear infinite}
#splash .spark{transform-box:fill-box;transform-origin:center;animation:spark 1.8s ease-in-out infinite alternate}
#splash .nm{position:relative;z-index:1;font:700 clamp(27px,6vw,36px) var(--fd);letter-spacing:.11em;text-transform:uppercase;color:#f8f5ed;animation:fadeUp .85s cubic-bezier(.2,.8,.2,1) .75s both}
#splash .nm b{color:#e2c98e;font-weight:700}
#splash .tagline{position:relative;z-index:1;max-width:88vw;text-align:center;color:#c8d2e4;font:500 11px/1.6 var(--fb);letter-spacing:.19em;text-transform:uppercase;animation:fadeUp .85s ease 1.15s both}
#splash .loading-line{position:relative;z-index:1;width:92px;height:2px;margin-top:10px;overflow:hidden;background:rgba(226,201,142,.18);border-radius:9px;animation:fadeUp .6s ease 1.3s both}
#splash .loading-line:after{content:"";display:block;width:45%;height:100%;background:#e2c98e;box-shadow:0 0 12px #e2c98e;animation:loadSweep 1.35s ease-in-out .1s infinite}
body.intro main>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:3s}
body.intro main>*:nth-child(2){animation-delay:3.08s}body.intro main>*:nth-child(3){animation-delay:3.16s}body.intro main>*:nth-child(n+4){animation-delay:3.24s}
@keyframes markIn{from{opacity:0;transform:translateY(18px) scale(.72) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes corePulse{0%{opacity:0;transform:scale(.72)}45%{opacity:1;transform:scale(1.06)}100%{opacity:.78;transform:scale(1)}}
@keyframes raySpin{to{transform:rotate(360deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{from{opacity:.35;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
@keyframes loadSweep{0%{transform:translateX(-110%)}100%{transform:translateX(240%)}}
:root[data-theme="light"] #splash{background:radial-gradient(ellipse at 50% 44%,#233c62 0%,#111d35 48%,#080e1a 100%)}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 13px var(--fb);padding:7px 12px;min-height:36px;cursor:pointer}
@keyframes sOut{to{opacity:0;visibility:hidden}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes sunUp{from{transform:translateY(130px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:var(--glow)}50%{box-shadow:0 0 0 rgba(0,0,0,0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#splash{display:none}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.bnav button{flex:1;border:0;background:none;color:var(--mute);font:600 12px var(--fb);min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.bnav button span{font-size:20px;line-height:1}.bnav button[aria-current=true]{color:var(--acc);background:var(--goldsoft)}
body.stu .wrap{padding-bottom:100px}
.tk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tkb{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:none;color:var(--acc-ink);font:800 16px var(--fb);cursor:pointer;flex:none}.tkb[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.tkt{flex:1;min-width:0;display:flex;flex-direction:column}.tkt small{color:var(--mute);font-size:13px}.tk.done .tkt b{text-decoration:line-through;color:var(--mute)}
.tkd{font:700 12px var(--fb);color:var(--mute);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin-bottom:10px}
.cm{padding:9px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;font-size:15px;line-height:1.4}.cm.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink)}.cm.ai{align-self:flex-start;background:var(--cream);border:1px solid var(--line)}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.bd{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;opacity:.4}.bd.on{opacity:1;border-color:var(--acc)}.bd b{display:block;font-size:26px}

/* Hedef yolculuğu */
.road .rdh{font-size:15px;margin:2px 0 4px}.road .rdn{float:right;color:var(--mute);font-size:13px}
.rd{position:relative;margin:26px 10px 4px}
.rdt{position:relative;height:12px;border-radius:99px;background:var(--line)}
.rdt u{position:absolute;top:50%;width:2px;height:12px;background:var(--cream);transform:translate(-50%,-50%);opacity:.6;z-index:2}
.rdf{position:absolute;left:0;top:0;bottom:0;border-radius:99px;width:calc(var(--p)*1%);background:linear-gradient(90deg,var(--navy2),var(--acc));animation:rdg 1.6s cubic-bezier(.2,.8,.2,1) both}
.rda{position:absolute;top:50%;left:calc(var(--p)*1%);transform:translate(-50%,-62%);font-size:26px;line-height:1;animation:rda 1.6s cubic-bezier(.2,.8,.2,1) both;z-index:3}
.rdi{display:inline-block}.rdi.bump{animation:hop .8s ease}
.rda .fl{position:absolute;right:100%;top:50%;width:26px;height:6px;border-radius:99px;background:linear-gradient(270deg,rgba(255,160,60,.9),transparent);transform:translateY(-50%);opacity:.0}
.road.live .rda .fl{opacity:1;animation:flame .5s ease-in-out infinite alternate}
.rda .plus{position:absolute;left:50%;bottom:100%;white-space:nowrap;font-size:13px;color:var(--ok);animation:flt 1.8s ease-out forwards}
.road.still .rdf,.road.still .rda{animation:none}
.rdm{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--mute)}
.rdc{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
@keyframes rdg{from{width:0}}@keyframes rda{from{left:0}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.25)}}
@keyframes flame{from{transform:translateY(-50%) scaleX(.55)}to{transform:translateY(-50%) scaleX(1)}}
@keyframes flt{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}

/* Next-gen dashboard refresh */
:root{--panel-shadow:0 16px 44px rgba(10,20,48,.07)}
body{background:radial-gradient(ellipse at 80% 0%,rgba(139,124,255,.055),transparent 35%),var(--cream)}
body:has(.side-nav) .wrap{max-width:none;width:100%;margin:0;padding:22px 28px 40px 260px}
body:has(.side-nav) header{max-width:1480px;margin:0 auto 18px;padding:0 0 16px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;letter-spacing:-.04em}header small{letter-spacing:.01em}
#app{max-width:1480px;margin:0 auto}
.dashboard-shell{display:block}
.dashboard-main{min-width:0;max-width:1180px;width:100%;margin:0 auto}
.side-nav{position:fixed;z-index:40;left:0;top:0;bottom:0;width:236px;padding:26px 14px 18px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.side-brand{display:flex;align-items:center;gap:11px;padding:5px 10px 25px}
.brand-mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#243b67,#10192f);color:#e2c98e;font:800 24px var(--fd);box-shadow:0 7px 18px rgba(15,25,50,.2)}
.side-brand b{display:block;font-size:13px;letter-spacing:.13em}.side-brand small{display:block;color:var(--mute);font-size:10px;letter-spacing:.14em;margin-top:2px}
.side-label{padding:7px 12px;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.13em}
.side-nav>button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;border:0;border-radius:13px;background:transparent;color:var(--mute);padding:10px 13px;text-align:left;font:600 14px var(--fb);cursor:pointer;transition:background .18s,color .18s}
.side-nav>button>span:first-child{width:22px;text-align:center;font-size:18px}
.side-nav>button:hover,.side-nav>button[aria-current=true]{background:var(--goldsoft);color:var(--acc)}
.nav-label{flex:1}.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line)}
.side-avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--goldsoft);color:var(--acc);font-weight:800}
.side-foot b,.side-foot small{display:block}.side-foot b{font-size:12px;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-foot small{font-size:11px;color:var(--mute)}
.page-intro{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 20px}
.page-intro h1{font-size:clamp(26px,3vw,36px);letter-spacing:-.055em;margin:3px 0 4px}.page-intro p{margin:0;color:var(--mute);font-size:14px}
.eyebrow{color:var(--acc);font-size:10px;font-weight:800;letter-spacing:.15em;margin-bottom:5px}
.status-pill,.count-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11px;color:var(--mute);white-space:nowrap}
.status-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--goldsoft)}
.card,.stat,.hero{box-shadow:var(--panel-shadow)}
.card{border-radius:20px;padding:20px;scroll-margin-top:24px}.card h2{font-size:18px;letter-spacing:-.025em}
.hero{border-radius:24px;padding:25px}.stats{gap:12px}.stat{border-radius:17px;padding:15px}.stat b{font-size:24px}
.sum{gap:12px}.s{border-radius:18px;padding:16px;transition:transform .18s,border-color .18s,box-shadow .18s}.s:hover{transform:translateY(-2px);box-shadow:var(--panel-shadow)}
.coach-section{scroll-margin-top:24px;margin-bottom:20px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:10px 0 13px}.section-heading h2{font-size:24px;letter-spacing:-.04em;margin:0}
.activity-card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:20px;margin-bottom:16px;box-shadow:var(--panel-shadow)}
.activity-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.activity-top h2{font-size:19px;letter-spacing:-.03em}.activity-top p{font-size:13px;color:var(--mute);margin:4px 0 0}
.activity-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--goldsoft);color:var(--acc);font-size:20px}
.activity-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0 10px}.activity-metrics>div{padding:11px 12px;background:var(--cream);border-radius:13px;min-width:0}

function rollover(){
  if(!ME||ROLE!=="student"||S.day===day())return false;
  const old=S,m=new Date();m.setHours(0,0,0,0);const mid=m.getTime(),oc=old.cur,was=oc&&(old.status==="study"||old.status==="break");
  if(oc){const v=Math.max(0,mid-oc.start-oc.brk-(old.status==="break"?mid-oc.bs:0));old.done+=v;old.meth[oc.meth]=(old.meth[oc.meth]||0)+v;old.cur=null;old.status="stopped";old.log.push({t:mid-1,m:"Gece yarısı: oturum otomatik bölündü"})}
  const sn=snap();try{localStorage.setItem(KEY+ME+"-"+old.day,JSON.stringify(old))}catch(e){}
  Promise.resolve(sb.from("daily").upsert({student_id:ME,day:old.day,state:old,snap:sn,updated_at:new Date().toISOString()})).then(r=>{if(r&&r.error)setSync("⚠️ "+r.error.message)},()=>setSync("⚠️ Bağlantı yok"));

}
async function flush(){

}

const actPct=()=>{const m={...S.meth};if(S.cur)m[S.cur.meth]=(m[S.cur.meth]||0)+curNet();const t=Object.values(m).reduce((a,b)=>a+b,0);return t?Math.round(ACT.reduce((a,k)=>a+(m[k]||0),0)/t*100):0};

function act(a){
  const n=Date.now();
  if(a==="wake"){S.status="awake";log("Uyandım")}
  if(a==="start"){S.cur={start:n,brk:0,bs:0,subj,meth};S.status="study";log("Derse başladım: "+subj+" ("+meth+")")}
  if(a==="break"){S.cur.bs=n;S.status="break";log("Mola verdim")}
  if(a==="back"){S.cur.brk+=n-S.cur.bs;S.status="study";log("Moladan döndüm")}
  if(a==="stop"){const v=curNet();S.done+=v;S.meth[S.cur.meth]=(S.meth[S.cur.meth]||0)+v;log("Çalışmayı noktaladım ("+short(v)+", "+S.cur.subj+")");BUMP={m:Math.max(1,Math.round(v/60000))};S.cur=null;S.status="stopped"}
  if(a==="prog"){S.prog=!S.prog;log(S.prog?"Programımı bitirdim":"Program işaretini kaldırdım")}
  if(a==="close"){if(S.cur){const v=curNet();S.done+=v;S.meth[S.cur.meth]=(S.meth[S.cur.meth]||0)+v;S.cur=null}S.status="closed";log("Günü kapattım")}
  save();render();
}

function flags(h){

  if(l2.length===C.th.gap&&l2.every(d=>d.m===0))o.push("Son "+C.th.gap+" gündür çalışma kaydı yok");
  if(past.length>=6){const a=l3.reduce((s,d)=>s+d.m,0)/3,b=past.slice(0,-3).reduce((s,d)=>s+d.m,0)/(past.length-3);if(b>0&&a<b*C.th.drop/100)o.push("Süre son 3 günde belirgin düştü")}
  if(l3.length===3&&l3.every(d=>d.mood>0&&d.mood<=C.th.mood))o.push("Gün puanı 3 gündür düşük");
  if(l3.length===3&&l3.every(d=>!d.prog))o.push("3 gündür program tamamlanmadı");
  const sl=l3.filter(d=>d.sleep>0);
  if(sl.length===3&&sl.reduce((s,d)=>s+d.sleep,0)/3<C.th.sleep)o.push("Uyku ortalaması "+C.th.sleep+" saatin altında");
  return o;
}

const csvCell=v=>{let s=v==null?"":String(v);if(typeof v==="string"&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
function csvDl(name,rows){
  const t="﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name+"-"+day()+".csv";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function pageAll(mk){let out=[],from=0;for(;;){const {data,error}=await mk().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}

let selDay=null,per="hw";const HIST={},DSTATE={};

async function loadHist(id){try{const {data,error}=await sb.from("daily").select("day,snap").eq("student_id",id).gte("day",dayN(-130)).order("day");if(error)throw error;HIST[id]=Object.fromEntries((data||[]).map(r=>[r.day,r.snap||{}]))}catch(e){HIST[id]=HIST[id]||{}}}
async function loadDay(id,d){try{const {data}=await sb.from("daily").select("state,snap").eq("student_id",id).eq("day",d).maybeSingle();DSTATE[id+"|"+d]=data||{state:{},snap:{}}}catch(e){DSTATE[id+"|"+d]={state:{},snap:{}}}}
function range(p){
  const t=new Date();t.setHours(0,0,0,0);
  const mon=d=>{const c=new Date(d);c.setDate(c.getDate()-(c.getDay()+6)%7);return c};
  let a,b;
  if(p==="hw"){a=mon(t);b=t}
  else if(p==="lw"){a=mon(t);a.setDate(a.getDate()-7);b=new Date(a);b.setDate(b.getDate()+6)}
  else if(p==="tm"){a=new Date(t.getFullYear(),t.getMonth(),1);b=t}
  else{a=new Date(t.getFullYear(),t.getMonth()-1,1);b=new Date(t.getFullYear(),t.getMonth(),0)}
  const o=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))o.push(ymd(d));return o;
}
function pastX(p,row){
  const s=row.state||{},sn=row.snap||{},qs=(s.qs||[]).map(q=>({s:String(q.s),n:num(q.n),c:num(q.c),b:num(q.b),k:q.k?String(q.k):""}));
  return {id:p.id,n:esc(p.name),st:LBL[s.status]?s.status:"idle",m:Math.round(sn.m!=null?num(sn.m):num(s.done)/60000),q:qs.reduce((a,q)=>a+q.n,0),p:s.prog?1:0,L:(s.log||[]).map(l=>({t:hm(num(l.t)),m:esc(l.m)})),qs,mood:num(s.mood)};
}
function histCard(id,X){
  const h=HIST[id];
  if(!h)return `<div class="card"><h2>Geçmiş</h2><p class="empty">Yükleniyor…</p></div>`;
  const t=day(),days=range(per).filter(d=>d<=t);
  const R=days.map(d=>{const s=d===t?{m:X.m,q:X.q,c:X.qs.reduce((a,q)=>a+q.c,0),prog:X.p>=1?1:0,mood:X.mood,sleep:X.sleep}:(h[d]||{});return {d,has:d===t||!!h[d],m:num(s.m),q:num(s.q),c:s.c==null?null:num(s.c),prog:num(s.prog),mood:num(s.mood),sleep:num(s.sleep)}});
  const sum=k=>R.reduce((a,r)=>a+r[k],0),tm=sum("m"),tq=sum("q"),worked=R.filter(r=>r.m>0).length;
  const ca=R.filter(r=>r.c!=null),cq=ca.reduce((a,r)=>a+r.q,0),acc=cq?Math.round(ca.reduce((a,r)=>a+r.c,0)/cq*100):null;
  const av=k=>{const v=R.filter(r=>r[k]>0);return v.length?(v.reduce((a,r)=>a+r[k],0)/v.length).toFixed(1):"–"};
  const mx=Math.max(1,...R.map(r=>r.m)),week={};
  if(per==="tm"||per==="lm")R.forEach(r=>{const[y,m,d]=r.d.split("-").map(Number),dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-(dt.getDay()+6)%7);const k=ymd(dt);(week[k]=week[k]||{m:0,q:0}).m+=r.m;week[k].q+=r.q});
  const chips=PER.map(([k,l])=>`<button class="chip" data-per="${k}" aria-pressed="${k===per}">${l}</button>`).join("");
  const dchips=[0,-1,-2,-3,-4,-5,-6].map(n=>{const d=dayN(n);return `<button class="chip" data-d="${d}" aria-pressed="${(selDay||t)===d}">${n===0?"Bugün":n===-1?"Dün":fd(d)}</button>`}).join("");
  const st=(b,s)=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`;
  return `<div class="card"><h2>Geçmiş günler</h2><div class="chips">${dchips}</div></div>

  <div class="stats" style="margin-top:12px">${st(hmin(tm),"toplam süre")}${st(hmin(Math.round(tm/Math.max(1,R.length))),"günlük ortalama")}${st(tq,"çözülen soru")}</div>
  <div class="stats">${st(worked+" / "+R.length,"çalışılan gün")}${st(sum("prog")+" / "+R.length,"program bitti")}${st(acc==null?"–":"%"+acc,"doğruluk")}</div>
  <div style="display:flex;gap:3px;align-items:end;height:60px">${R.map(r=>`<div title="${fd(r.d)}: ${r.m} dk" style="flex:1;background:var(--gold);border-radius:3px 3px 0 0;height:${Math.max(3,Math.round(r.m/mx*100))}%"></div>`).join("")}</div>
  <p class="empty" style="font-size:13px;margin:6px 0 10px">Ortalama uyku ${av("sleep")} sa · gün puanı ${av("mood")} / 5</p>
  ${Object.keys(week).sort().map(k=>`<div class="subj"><span>Hafta: ${fd(k)}</span><span>${hmin(week[k].m)} · ${week[k].q} soru</span></div>`).join("")}
  ${R.length?R.slice().reverse().map(r=>`<button class="rb" data-d="${r.d}"><span>${fd(r.d)}</span><span>${r.has?hmin(r.m)+" · "+r.q+" soru"+(r.prog?" · ✓":""):"kayıt yok"}</span></button>`).join(""):`<p class="empty">Bu dönemde gün yok.</p>`}</div>`;
}

function tcExpand(d){

function tcMemo(){

  TC.data.p.forEach(p=>{m.byKod[p.kod]=p});

function tcInit(){

  const done=j=>{j=tcExpand(j);TC.data=j&&Array.isArray(j.p)?j:{meta:{},p:[]};TC._m=null;TC._sig="";TC.st="ok";if(tab==="t")render()};

// Eğilim tahmini (resmî değildir): yıllara göre taban puanına doğru çizgisi uydurulur, bir sonraki yıl için temkinli (%70) uzatılır.
function tcFc(p){
  if(p._f!==undefined)return p._f;
  const h=p.h||{},last=(TC.data.meta&&TC.data.meta.yil)||2026,pts=[];
  Object.keys(h).forEach(y=>{if(h[y]&&h[y][0]!=null)pts.push([+y,h[y][0]])});
  if(p.tp!=null)pts.push([last,p.tp]);
  pts.sort((a,b)=>a[0]-b[0]);
  if(pts.length<3||p.tp==null)return p._f=null;
  const n=pts.length,mx=pts.reduce((a,q)=>a+q[0],0)/n,my=pts.reduce((a,q)=>a+q[1],0)/n;
  const sxx=pts.reduce((a,q)=>a+(q[0]-mx)**2,0),sl=pts.reduce((a,q)=>a+(q[0]-mx)*(q[1]-my),0)/sxx;
  const sd=Math.sqrt(pts.reduce((a,q)=>a+(q[1]-(my+sl*(q[0]-mx)))**2,0)/Math.max(1,n-2));
  return p._f={pred:p.tp+0.7*sl,slope:sl,band:Math.max(4,1.3*sd+0.5*Math.abs(sl)),pts,next:last+1};

const tcRef=p=>{if(TC.fc){const f=tcFc(p);if(f)return f.pred}return p.tp};

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="flex:none"><polyline points="${pl}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linejoin="round"/><line x1="${X(lp[0]).toFixed(1)}" y1="${Y(lp[1]).toFixed(1)}" x2="${X(f.next).toFixed(1)}" y2="${Y(f.pred).toFixed(1)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="3 3"/><circle cx="${X(f.next).toFixed(1)}" cy="${Y(f.pred).toFixed(1)}" r="3.5" fill="var(--acc)"/></svg>`;
}
function tcFcHTML(p){

// Tahmini sınıflandırma (resmî değildir): öğrencinin puanı, 2026 yerleşen son öğrencinin (taban) puanıyla kıyaslanır.
function tcClass(puan,p){

let CH={st:"idle",list:[],sel:null,board:null,busy:false,msg:""};
const chDays=(a,b)=>{const p=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).getTime()};return Math.round((p(b)-p(a))/864e5)};
const chActive=c=>c&&c.start_day<=day()&&c.end_day>=day();
const chVal=(c,v)=>c.metric==="minutes"?hmin(Math.round(v)):Math.round(v)+" soru";
async function chBoardLoad(){
  const c=CH.list.find(x=>x.id===CH.sel);if(!c){CH.board=null;return}
  try{const r=await sb.rpc("challenge_board",{p_id:c.id});CH.board=r&&!r.error&&Array.isArray(r.data)?{id:c.id,rows:r.data}:{id:c.id,rows:[]}}catch(e){CH.board={id:c.id,rows:[]}}
}
async function chLoad(force){
  if(CH.busy||(CH.st!=="idle"&&!force))return;CH.busy=true;CH.st="load";
  try{
    const r=await sb.from("challenges").select("id,title,metric,start_day,end_day,notified_at").order("id",{ascending:false}).limit(8);
    CH.list=r&&Array.isArray(r.data)?r.data:[];
    if(!CH.list.find(x=>x.id===CH.sel)){const a=CH.list.find(chActive);CH.sel=(a||CH.list[0]||{}).id||null}
    await chBoardLoad();
  }catch(e){}
  CH.st="ok";CH.busy=false;if(tab==="y"||ROLE==="coach"||tab==="b")render();
}
function chBoardHTML(c){
  const B=CH.board&&CH.board.id===c.id?CH.board.rows:null;
  if(!B)return `<p class="empty">Yükleniyor…</p>`;
  if(!B.length)return `<p class="empty">Henüz sıralama yok.</p>`;
  const tot=+B[0].total||0;
  return B.map((r,i)=>{const t=+r.total||0,w=tot?Math.max(3,Math.round(t*100/tot)):0,md=["🥇","🥈","🥉"][i]||`<b>${i+1}</b>`;
    return `<div class="chr${r.me?" me":""}"><span class="chk">${md}</span><span class="chn">${esc(r.label)}${r.live?` <i class="chl" title="Şu an çalışıyor"></i>`:""}${r.me?" · sen":""}<span class="ktpr"><i style="width:${w}%"></i></span></span><span class="chv">${chVal(c,t)}${+r.today>0?`<small>bugün +${chVal(c,+r.today)}</small>`:""}</span></div>`}).join("");
}
function chInfo(c){
  const left=chDays(day(),c.end_day),st=day()<c.start_day?`${chDays(day(),c.start_day)} gün sonra başlıyor`:left>=0?(left===0?"son gün":left+" gün kaldı"):"bitti";
  return `${c.metric==="minutes"?"En çok çalışma süresi":"En çok çözülen soru"} · ${fd(c.start_day)} – ${fd(c.end_day)} · ${st}`;

async function chCreate(){
  const g=i=>document.getElementById(i).value,title=g("cht").trim().slice(0,80),m=g("chm"),a=g("chs"),b=g("che");
  if(title.length<3){CH.msg="Başlık en az 3 harf olmalı.";render();return}
  if(!a||!b||b<a||chDays(a,b)>60){CH.msg="Tarihleri kontrol et (bitiş başlangıçtan önce olamaz, en fazla 60 gün).";render();return}
  if(!confirm("“"+title+"” yarışması oluşturulsun ve tüm öğrencilere bildirim gitsin mi?"))return;
  CH.msg="Oluşturuluyor…";render();
  const r=await sb.from("challenges").insert({title,metric:m,start_day:a,end_day:b,created_by:ME}).select("id");
  if(r&&r.error||!(r&&r.data&&r.data[0])){CH.msg="Oluşturulamadı: "+((r&&r.error&&r.error.message)||"hata");render();return}
  const id=r.data[0].id;CH.sel=id;

function weekEff(sid){

}

function lineSVG(pts,target){
  const W=320,H=130,pl=30,pr=10,pt=12,pb=22;
  const ys=pts.map(q=>q.y).concat(target==null?[]:[target]),lo=Math.floor(Math.min(...ys)-2),hi=Math.ceil(Math.max(...ys)+2),rg=Math.max(1,hi-lo);
  const X=i=>pl+(pts.length>1?i*(W-pl-pr)/(pts.length-1):0),Y=v=>pt+(hi-v)*(H-pt-pb)/rg;
  const path=pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.y).toFixed(1)).join(" ");
  const dots=pts.map((q,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="3.5" fill="var(--gold)"/><text x="${X(i).toFixed(1)}" y="${(Y(q.y)-7).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink)">${num(q.y)}</text>`).join("");
  const tl=target==null?"":`<line x1="${pl}" x2="${W-pr}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${(Y(target)-4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ok)">hedef ${num(target)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net grafiği" style="display:block"><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/><text x="${pl-4}" y="${pt+4}" text-anchor="end" font-size="10" fill="var(--mute)">${hi}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end" font-size="10" fill="var(--mute)">${lo}</text>${tl}<path d="${path}" fill="none" stroke="var(--navy2)" stroke-width="2"/>${dots}</svg>`;
}

async function prepImage(file){
  try{
    const bmp=await createImageBitmap(file),sc=Math.min(1,2400/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return {mime:"image/jpeg",b64:c.toDataURL("image/jpeg",.88).split(",")[1]};
  }catch(e){
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({mime:file.type||"image/jpeg",b64:String(r.result).split(",")[1]});r.onerror=rej;r.readAsDataURL(file)});
  }
}
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(f)});
async function examExtract(){
  const f=document.getElementById("exf").files[0];
  if(!f){setEx("Önce bir görsel veya PDF seç.");return}
  const pdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");
  if(pdf){
    if(f.size>6.5e6){setEx("PDF çok büyük (en fazla yaklaşık 6 MB). Sayfa sayısını azaltıp tekrar dene.");return}
    setEx("PDF okunuyor, 15-30 saniye sürebilir…");
    let b64;try{b64=await readB64(f)}catch(e){setEx("PDF açılamadı.");return}
    const r=await callFn("exam-extract",{image:b64,mime:"application/pdf"});
    if(r.error){setEx(r.error);return}
    PX={exam:r.exam,uyarilar:r.uyarilar||[]};setEx("");render();return;
  }
  if(f.size>15e6){setEx("Görsel çok büyük (en fazla 15 MB).");return}
  setEx("Görsel okunuyor, 10-20 saniye sürebilir…");
  let im;try{im=await prepImage(f)}catch(e){setEx("Görsel açılamadı.");return}
  const r=await callFn("exam-extract",{image:im.b64,mime:im.mime});
  if(r.error){setEx(r.error);return}
  PX={exam:r.exam,uyarilar:r.uyarilar||[]};setEx("");render();
}

async function examSave(){

  const e=PX.exam,tur=document.getElementById("ext").value,name=document.getElementById("exn").value.trim().slice(0,120),date=document.getElementById("exd").value;
  if(!tur||!name){err("Deneme adı ve türü gerekli.");return}
  if(!e.dersler.length){err("Kaydedilecek ders satırı yok.");return}
  const k=tur==="LGS"?3:4,subs=[];let okc=0,fixc=0,missc=0;
  for(let i=0;i<e.dersler.length;i++){

    if(v.some(x=>x===""||+x<0)){err("Boş kalan doğru, yanlış ve boş alanlarını doldur.");return}

  ${hd?h2("Hedef durumu")+`<div class="subj"><span>${esc(hd.tur)} hedefi: ${num(hd.hedef_net)} net${hd.hedef_puan==null?"":" · "+num(hd.hedef_puan)+" puan"}</span><span>${hd.son_net==null?"Henüz deneme yok":"Son: "+num(hd.son_net)+" · "+(num(hd.kalan_net)>0?num(hd.kalan_net)+" net kaldı":"hedefe ulaşıldı")}</span></div>${hd.son_3_ortalama==null?"":`<div class="subj"><span>Son 3 deneme ortalaması</span><span>${num(hd.son_3_ortalama)} net</span></div>`}${hd.not?`<div class="empty" style="font-size:13px;margin-top:4px">Not: ${esc(hd.not)}</div>`:""}${r.hedef_yorumu?`<p class="empty" style="font-size:14px;margin:8px 0 0">${esc(r.hedef_yorumu)}</p>`:""}`:""}
  ${stale?`<p class="empty" style="color:var(--warn);font-size:13px">Hedef değişti. Analizi yenilersen yapay zekâ yeni hedefe göre yorumlar.</p>`:""}
  ${(r.koc_basliklari||[]).length?h2("Görüşme başlıkları (koç)")+`<ul class="tl">${li(r.koc_basliklari)}</ul>`:""}
  ${r.veri_notu?`<p class="empty" style="font-size:13px;margin:12px 0 0">${esc(r.veri_notu)}</p>`:""}
  <p class="empty" style="font-size:12px;margin:8px 0 0">Bu analiz yapay zekâ ile üretilmiştir, kesin bir sonuç değil bir rehberdir.</p></div>`;
}
function aiReportCard(sid,title){
  if(AIBUSY===sid)return `<div class="card"><h2>Yapay zekâ analizi</h2><p class="empty">Analiz hazırlanıyor…</p></div>`;
  return AIR[sid]?reportHTML(AIR[sid],title,sid):"";
}
function examRows(L,mode){return L.slice().reverse().slice(0,mode?12:8).map(e=>`<div class="subj"><span>${esc(e.exam_name)} · ${esc(e.exam_type)}</span><span>${e.total_net==null?"–":num(e.total_net)+" net"}${e.exam_date?" · "+fd(String(e.exam_date)):""}${mode?` <button class="chip" data-exdel="${e.id}" aria-label="Denemeyi sil">Sil</button>`+(mode==="own"?` <button class="chip" data-exedit="${e.id}" aria-label="Denemeyi düzelt">Düzelt</button>`:""):""}</span></div>`).join("")}
function examCard(){
  if(PX)return examForm();
  const L=EX[ME]||[];
  return `<div class="card"><h2>Deneme sonuçlarım</h2>
  <p class="empty" style="margin:0 0 10px">Deneme sonuç görselini ya da PDF'ini yükle, yapay zekâ okusun. Sen kontrol edip onaylarsın. PDF genelde daha hızlı ve net okunur.</p>

function aiCard(sid){
  const L=EX[sid]||[];
  const M=L.map(x=>x.extraction_meta).filter(Boolean),tot=M.reduce((a,m)=>a+num(m.okunan),0),fix=M.reduce((a,m)=>a+num(m.duzeltilen),0);
  const acc=tot?`<p class="empty" style="font-size:13px;margin:8px 0 0">Yapay zekâ okuma doğruluğu: %${Math.round((tot-fix)/tot*100)} (${tot} alandan ${fix} tanesi öğrenci tarafından düzeltildi)</p>`:"";
  return `<div class="card"><h2>Deneme sonuçları ve yapay zekâ</h2>${L.length?examRows(L,"coach"):`<p class="empty">Öğrenci henüz deneme sonucu yüklemedi.</p>`}

}

const setSync=m=>{const e=document.getElementById("sync");if(e)e.textContent=m};
const dbw=p=>Promise.resolve(p).then(r=>{if(r&&r.error)setSync("⚠️ "+r.error.message);return r},()=>setSync("⚠️ Bağlantı yok"));
const busy=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
const loginView=msg=>`<div class="card" style="max-width:380px;margin:30px auto"><h2>Giriş</h2><div class="row" style="flex-direction:column;align-items:stretch"><label>Kullanıcı adı<input id="lu" autocomplete="username" autocapitalize="none" style="width:100%"></label><label>PIN / şifre<input id="lp" type="password" autocomplete="current-password" style="width:100%"></label><div id="ts"></div><button class="btn" id="login">Giriş yap</button></div>${msg?`<p class="empty" style="color:var(--warn)">${esc(msg)}</p>`:""}</div>`;
/* Cloudflare Turnstile (robot doğrulaması). TS_KEY boşsa kapalıdır; Supabase'de Captcha açılmadan önce anahtar buraya yazılmalıdır. */
const TS_KEY="0x4AAAAAAFZUyqWLetPIf5hy";let TSTOKEN="",TSID=null,TSLOAD=null;
function tsScript(){return TSLOAD||(TSLOAD=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.async=true;s.onload=ok;s.onerror=no;document.head.appendChild(s)}))}
async function tsMount(){
  TSTOKEN="";TSID=null;if(!TS_KEY)return;
  const el=document.getElementById("ts");if(!el)return;
  try{await tsScript();if(window.turnstile&&document.getElementById("ts"))TSID=window.turnstile.render("#ts",{sitekey:TS_KEY,callback:t=>{TSTOKEN=t},"expired-callback":()=>{TSTOKEN=""},"error-callback":()=>{TSTOKEN=""},theme:"auto",language:"tr"})}catch(e){el.textContent="Robot doğrulaması yüklenemedi. İnternetini kontrol edip sayfayı yenile."}
}
const setLoginMsg=m=>{let e=document.getElementById("lmsg");if(!e){e=document.createElement("p");e.id="lmsg";e.className="empty";e.style.color="var(--warn)";const t=document.getElementById("ts");(t?t.parentNode:document.getElementById("app")).appendChild(e)}e.textContent=m};
const showLogin=msg=>{document.getElementById("app").innerHTML=loginView(msg);tsMount()};
async function doLogin(){
  const u=document.getElementById("lu").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),p=document.getElementById("lp").value;
  if(!u||!p)return;
  if(TS_KEY&&!TSTOKEN)return setLoginMsg("Önce robot doğrulamasını tamamla.");
  const r=await sb.auth.signInWithPassword({email:u+"@takip.karakis.app",password:p,options:TS_KEY?{captchaToken:TSTOKEN}:undefined});
  if(r.error){
    const m=String(r.error.message||""),st=r.error.status;
    showLogin(/captcha/i.test(m)?"Robot doğrulaması başarısız, tekrar dene.":st===429||/rate|too many/i.test(m)?"Çok fazla deneme yapıldı, biraz bekleyip tekrar dene.":(st===400||/invalid/i.test(m))?"Kullanıcı adı veya PIN hatalı.":"Giriş yapılamadı. İnternet bağlantını kontrol et.");return}
  start();
}
async function loadStudent(){
  const r=await sb.from("daily").select("state").eq("student_id",ME).eq("day",day()).maybeSingle();
  let loc=null;try{const j=JSON.parse(localStorage.getItem(KEY+ME)||"null");if(j&&j.day===day()&&Array.isArray(j.log))loc=Object.assign(fresh(),j)}catch(e){}
  if(r.error){
    // Okuma başarısızsa boş gün kurup sunucudaki kaydın üstüne yazma: cihazdaki yedeği kullan, yoksa durma.
    if(!loc)throw new Error("Verilerin yüklenemedi. İnternetini kontrol edip sayfayı yenile.");
    S=loc;setSync("⚠️ Sunucuya ulaşılamadı, cihazdaki kayıt gösteriliyor");
  }else{
    const srv=r.data?Object.assign(fresh(),r.data.state):null;
    // Sunucuya henüz gitmemiş yerel kayıt daha ilerideyse onu koru.
    S=srv&&loc?(loc.log.length>srv.log.length?loc:srv):(srv||loc||fresh());
    if(S===loc&&loc.log.length&&(!srv||loc.log.length>srv.log.length))DIRTY=true;
  }
  S.day=day();if(DIRTY)save();
  await pullStudent();await Promise.all([loadExams(ME),loadReport(ME),loadTarget(ME),loadTasks(ME),loadHist(ME)]);
}
async function pullStudent(){
  const [g,n]=await Promise.all([sb.from("goals").select("*").eq("student_id",ME).eq("day",day()).maybeSingle(),sb.from("notes").select("body,created_at").eq("student_id",ME).order("created_at")]);
  C.goals[ME]=g.data?{day:g.data.day,s:g.data.subj,q:g.data.q,m:g.data.m}:undefined;
  C.notes[ME]=(n.data||[]).map(r=>({t:Date.parse(r.created_at),x:r.body}));
}
async function pullCoach(){
  const [p,d,g,n,e,w]=await Promise.all([sb.from("profiles").select("id,name").eq("role","student").order("name"),sb.from("daily").select("student_id,day,state,snap").gte("day",dayN(-6)),sb.from("goals").select("*").eq("day",day()),sb.from("notes").select("student_id,body,created_at").order("created_at"),sb.from("exam_results").select("student_id,topics").order("exam_date").order("created_at"),sb.from("weekly_tasks").select("student_id,done").gte("task_date",dayN(-6)).lte("task_date",day())]);
  STU=p.data||[];ROWS=d.data||[];C.goals={};C.notes={};C.den={};
  (g.data||[]).forEach(r=>C.goals[r.student_id]={day:r.day,s:r.subj,q:r.q,m:r.m});
  (n.data||[]).forEach(r=>(C.notes[r.student_id]=C.notes[r.student_id]||[]).push({t:Date.parse(r.created_at),x:r.body}));
  EXALL=e.data||[];TKALL=w.data||[];
}
let rt;
const refresh=()=>{clearTimeout(rt);rt=setTimeout(async()=>{if(!ME||busy()||PX||AIBUSY||PLANBUSY||CHATBUSY)return;try{if(ROLE==="coach"){await pullCoach();if(sel)await Promise.all([loadHist(sel),loadTasks(sel),loadExams(sel)])}else await Promise.all([pullStudent(),loadTasks(ME)]);render();setSync("Güncellendi "+hm(Date.now()))}catch(e){}},2500)};
async function start(){
  const app=document.getElementById("app");
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  ME=session.user.id;
  const {data:p,error:pe}=await sb.from("profiles").select("name,role").eq("id",ME).maybeSingle();
  if(pe){ME=null;showLogin("Sunucuya ulaşılamadı. İnternetini kontrol edip sayfayı yenile.");return}
  if(!p){await sb.auth.signOut();ME=null;showLogin("Profil bulunamadı, koçuna haber ver.");return}
  NAME=p.name;ROLE=p.role;view=ROLE==="coach"?"c":"s";
  document.getElementById("who").textContent=NAME+" · ";document.getElementById("out").hidden=false;document.getElementById("reset").hidden=ROLE==="coach";document.body.classList.toggle("stu",ROLE==="student");document.body.classList.toggle("coach",ROLE==="coach");if(ROLE==="student")setTimeout(()=>{try{tcInit()}catch(e){}},4500);
  if(ROLE==="coach"){await pullCoach();["daily","goals","notes","exam_results","weekly_tasks"].reduce((ch,t)=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},refresh),sb.channel("koc")).subscribe();setInterval(refresh,60000)}
  else{await loadStudent();setInterval(refresh,45000);setInterval(()=>{if(rollover()){save();render()}},30000);pushState().then(()=>{if(tab==='h')render()})}
  render();
}
