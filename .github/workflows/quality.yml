name: Quality checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  browser-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            deno check "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' -type f | sort)

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical repository invariants
        shell: bash
        run: bash tests/quality-contracts.sh
