name: Claude Code
# Bir issue'da ya da PR yorumunda "@claude ..." yazınca Claude kodu okur, değişikliği ayrı bir dalda yapar.
# O dal için Cloudflare kendiliğinden önizleme açar; işlev testleri de çalışır. main'e Claude değil, Hasan birleştirir.
# Gerekli secret (biri yeterli): CLAUDE_CODE_OAUTH_TOKEN (Claude aboneliği, `claude setup-token`) ya da ANTHROPIC_API_KEY.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    # Yalnızca depo sahibi tetikleyebilir (kota ve güvenlik için).
    if: |
      github.actor == github.repository_owner && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR'daki test sonuçlarını okuyabilsin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Claude değişiklikten sonra testleri kendisi çalıştırabilsin diye (bkz. CLAUDE.md → Test).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test araçları
        run: |
          pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(python tests/run_all.py*),Bash(node --check *),Bash(node --test tests/*),Bash(sh scripts/bump.sh),Bash(git diff*),Bash(git status*),Bash(git log*)"
            --append-system-prompt "GitHub Actions içinde çalışıyorsun. Supabase MCP, Google Drive ve canlı veritabanı burada YOK: veritabanı değişikliği gerekiyorsa SQL'i supabase/ altına dosya olarak ekle ve PR açıklamasında Hasan'ın SQL Editor'da çalıştırması gerektiğini yaz. Asla main'e doğrudan gönderme. Değişiklikten sonra ilgili testi 'python tests/run_all.py test_X.py' ile çalıştır. Kullanıcıya her şeyi Türkçe yaz."
