name: Dependency vulnerability review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
