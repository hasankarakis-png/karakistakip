# Requires GitHub Dependency Graph to be enabled in repository Security settings.
# Activate pull_request trigger after Dependency Graph is enabled.
name: Dependency vulnerability review (manual until configured)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
